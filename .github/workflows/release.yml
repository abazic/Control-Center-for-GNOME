name: Release GNOME Extension

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to create (for example, v0.1.1). Leave empty to only build the ZIP."
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish extension
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install GNOME extension tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes gnome-shell

      - name: Package extension
        run: |
          mkdir -p dist
          gnome-extensions pack --force \
            --extra-source=system.js \
            --extra-source=media.js \
            --extra-source=control-center-symbolic.svg \
            --out-dir=dist .

          test -s dist/control-center@abazic.github.io.shell-extension.zip

      - name: Publish GitHub Release
        if: github.ref_type == 'tag' || inputs.tag_name != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/control-center@abazic.github.io.shell-extension.zip
